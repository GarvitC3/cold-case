<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Cold Case</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1626'/%3E%3Cpath d='M16 5v22M7 10l18 12M25 10L7 22' stroke='%23BFEFFF' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="css/app.css">

<body>
<div id="app" data-screen="now">
  <header id="topbar">
    <button id="wordmark" aria-label="Cold Case (hold for settings)"><b>COLD</b><span>CASE</span></button>
    <button id="sitechip" class="chipbtn" aria-label="Change site"></button>
    <div id="pills" aria-live="polite"></div>
  </header>
  <div id="banner" hidden></div>
  <main id="stage"></main>
  <nav id="nav" aria-label="Screens"></nav>
  <div id="sheet-root"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
